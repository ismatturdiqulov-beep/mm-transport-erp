<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">

<title>Ангрен Каолин — учёт перевозок</title>
<!--
  Блок «Ангрен Каолин». Отдельный модуль: свой код (ничего не импортирует из
  mm_transport), свои таблицы ak_* и свой допуск ak_members. Общее с mm_transport
  только одно — вход (тот же Supabase Auth, одна сессия на обе вкладки).
  Реальных данных в этом файле нет: репозиторий публичный.
-->
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');
:root{
  --bg:#f5f4f0;--surface:#fff;--surface2:#f0efe9;--border:#e0ddd5;--border2:#ccc9be;
  --text:#1a1916;--text2:#6b6860;--text3:#9b9890;
  --accent:#5a3a12;--accent2:#9a5b14;--tab:#1a3a5c;
  --green:#1a5c35;--green-bg:#e8f5ee;--red:#8b1a1a;--red-bg:#fdf0f0;--amber:#7a4a00;--amber-bg:#fff8e8;--blue-bg:#e8f0fa;
  --font:'IBM Plex Sans',sans-serif;--mono:'IBM Plex Mono',monospace;--radius:8px;--radius-lg:12px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px;min-height:100vh;}
.hidden{display:none!important;}
/* вход */
.login-overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);z-index:500;}
.login-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:28px 30px;width:340px;max-width:92vw;}
.login-box .co{font-size:18px;font-weight:600;}
.login-box .sub{font-size:12px;color:var(--text3);margin:3px 0 16px;}
.err{display:none;background:var(--red-bg);color:var(--red);border:1px solid #f0c0c0;border-radius:var(--radius);padding:8px 10px;font-size:12.5px;margin-bottom:10px;}
/* каркас */
.app{display:flex;min-height:100vh;}
.sidebar{width:230px;background:var(--accent);color:#fff;flex-shrink:0;display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:100;overflow-y:auto;}
.tabs{display:flex;gap:4px;padding:10px 10px 0;}
.tabs a{flex:1;text-align:center;font-size:11.5px;font-weight:600;padding:7px 4px;border-radius:6px 6px 0 0;color:#fff;text-decoration:none;opacity:.55;background:rgba(0,0,0,.18);}
.tabs a.on{opacity:1;background:rgba(255,255,255,.16);}
.tabs a:hover{opacity:1;}
.logo{padding:14px 20px 12px;border-bottom:1px solid rgba(255,255,255,.12);}
.logo .co{font-size:15px;font-weight:600;}
.logo .sub{font-size:10.5px;opacity:.55;margin-top:2px;}
.nav{padding:8px 0;flex:1;}
.nav-lbl{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;opacity:.4;padding:10px 18px 4px;}
.nav-item{display:flex;align-items:center;gap:9px;padding:8px 18px;cursor:pointer;font-size:13px;opacity:.75;border-left:3px solid transparent;}
.nav-item:hover{opacity:1;background:rgba(255,255,255,.07);}
.nav-item.active{opacity:1;background:rgba(255,255,255,.13);border-left-color:#ffc36a;font-weight:500;}
.nav-item .ico{width:16px;text-align:center;}
.side-bottom{padding:12px 18px;border-top:1px solid rgba(255,255,255,.12);font-size:11.5px;}
.side-bottom .who{opacity:.8;margin-bottom:6px;word-break:break-all;}
.side-bottom button{background:none;border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:6px;padding:4px 10px;font-size:11.5px;cursor:pointer;font-family:var(--font);}
.main{margin-left:230px;flex:1;min-width:0;}
.page{padding:22px 26px;display:none;}
.page.active{display:block;}
h1{font-size:19px;font-weight:600;margin-bottom:4px;}
.lead{color:var(--text2);font-size:12.5px;margin-bottom:16px;max-width:820px;line-height:1.5;}
.ro-badge{display:inline-block;background:var(--amber-bg);color:var(--amber);border:1px solid #f0d898;border-radius:20px;font-size:11px;padding:2px 9px;margin-left:8px;vertical-align:middle;font-weight:500;}
/* элементы */
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px;}
.toolbar .grow{flex:1;}
input,select,textarea{font-family:var(--font);font-size:13px;border:1px solid var(--border2);border-radius:6px;padding:7px 9px;background:#fff;color:var(--text);width:100%;}
textarea{min-height:70px;resize:vertical;}
input[type=checkbox]{width:auto;}
.toolbar input[type=search]{max-width:320px;}
.btn{font-family:var(--font);font-size:13px;border:1px solid var(--border2);background:var(--surface);border-radius:6px;padding:7px 13px;cursor:pointer;white-space:nowrap;}
.btn:hover{background:var(--surface2);}
.btn.primary{background:var(--accent2);border-color:var(--accent2);color:#fff;}
.btn.primary:hover{filter:brightness(1.08);}
.btn.small{padding:4px 9px;font-size:12px;}
.btn:disabled{opacity:.5;cursor:default;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:14px 16px;margin-bottom:14px;}
.card h2{font-size:14px;font-weight:600;margin-bottom:10px;}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-bottom:16px;}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:13px 15px;}
.stat .sl{font-size:10.5px;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px;}
.stat .sv{font-size:20px;font-weight:600;font-family:var(--mono);}
.stat .ss{font-size:11px;color:var(--text3);margin-top:3px;}
.tbl-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:auto;}
table{width:100%;border-collapse:collapse;font-size:12.5px;}
th{text-align:left;font-weight:600;font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:.04em;padding:9px 10px;border-bottom:1px solid var(--border);background:var(--surface2);white-space:nowrap;position:sticky;top:0;}
td{padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:top;}
tr.click{cursor:pointer;}
tr.click:hover td{background:#faf8f2;}
tr.off td{color:var(--text3);}
td.num,th.num{text-align:right;font-family:var(--mono);white-space:nowrap;}
.mono{font-family:var(--mono);}
.muted{color:var(--text3);}
.tag{display:inline-block;font-size:10.5px;padding:1px 7px;border-radius:10px;margin:1px 3px 1px 0;border:1px solid var(--border2);color:var(--text2);white-space:nowrap;}
.tag.green{background:var(--green-bg);color:var(--green);border-color:#b0d8b8;}
.tag.amber{background:var(--amber-bg);color:var(--amber);border-color:#f0d898;}
.tag.red{background:var(--red-bg);color:var(--red);border-color:#f0c0c0;}
.tag.blue{background:var(--blue-bg);color:#2559a0;border-color:#b8d0f0;}
.empty{padding:26px;text-align:center;color:var(--text3);}
.hint{font-size:11.5px;color:var(--text3);margin-top:3px;line-height:1.4;}
.note{background:var(--blue-bg);border:1px solid #b8d0f0;color:#1d4479;border-radius:var(--radius);padding:9px 12px;font-size:12.5px;margin-bottom:14px;line-height:1.45;}
.note.amber{background:var(--amber-bg);border-color:#f0d898;color:var(--amber);}
/* модалка */
.modal-bg{position:fixed;inset:0;background:rgba(20,18,14,.45);display:none;align-items:flex-start;justify-content:center;z-index:300;overflow-y:auto;padding:40px 12px;}
.modal-bg.open{display:flex;}
.modal{background:var(--surface);border-radius:var(--radius-lg);width:640px;max-width:100%;padding:20px 22px;}
.modal h3{font-size:16px;font-weight:600;margin-bottom:14px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;}
.grid2 .full{grid-column:1/-1;}
.grid3{display:grid;grid-template-columns:2fr 1fr 1.3fr;gap:10px 14px;margin-top:10px;}
.cur-static{padding:7px 9px;border:1px solid var(--border);border-radius:6px;background:var(--surface2);font-size:13px;}
details.more{margin-top:14px;border:1px solid var(--border);border-radius:var(--radius);padding:0 12px;}
details.more>summary{cursor:pointer;padding:9px 0;font-size:12.5px;color:var(--text2);font-weight:500;list-style:none;}
details.more>summary::before{content:'▸ ';}
details.more[open]>summary::before{content:'▾ ';}
details.more[open]{padding-bottom:12px;}
.fr label{display:block;font-size:11.5px;color:var(--text2);margin-bottom:3px;font-weight:500;}
.fr.chk label{display:flex;gap:7px;align-items:center;font-size:13px;color:var(--text);font-weight:400;cursor:pointer;}
.modal .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap;}
.modal .actions .left{margin-right:auto;}
.sub-list{margin-top:14px;border-top:1px solid var(--border);padding-top:12px;}
.sub-list h4{font-size:12.5px;font-weight:600;margin-bottom:6px;}
.toast{position:fixed;bottom:20px;right:20px;background:#1a1916;color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;z-index:600;opacity:0;transition:opacity .2s;pointer-events:none;max-width:420px;}
.toast.show{opacity:1;}
.toast.bad{background:var(--red);}
.diff{font-size:11.5px;line-height:1.5;}
.diff b{font-weight:600;}
.diff .old{color:var(--red);text-decoration:line-through;}
.diff .new{color:var(--green);}
@media (max-width:820px){
  .sidebar{position:static;width:100%;}
  .app{flex-direction:column;}
  .main{margin-left:0;}
  .nav{display:flex;flex-wrap:wrap;padding:4px 6px;}
  .nav-lbl{display:none;}
  .nav-item{padding:7px 10px;border-left:none;border-bottom:2px solid transparent;}
  .nav-item.active{border-bottom-color:#ffc36a;}
  .page{padding:16px 12px;}
  .grid2,.grid3{grid-template-columns:1fr;}
}
</style>
</head>
<body>

<div class="login-overlay" id="login-screen">
  <div class="login-box" id="login-box">
    <div class="co">Ангрен Каолин</div>
    <div class="sub">учёт перевозок и расчётов · вход</div>
    <div class="err" id="login-error"></div>
    <form id="login-form" onsubmit="event.preventDefault();doLogin();">
      <div class="fr" style="margin-bottom:10px;"><label>Email</label><input type="email" id="login-email" autocomplete="username" required></div>
      <div class="fr" style="margin-bottom:14px;"><label>Пароль</label><input type="password" id="login-password" autocomplete="current-password" required></div>
      <button type="submit" class="btn primary" id="login-btn" style="width:100%;">Войти</button>
    </form>
    <div class="hint" style="margin-top:12px;">Тот же логин и пароль, что и для ММ Транспорт.</div>
  </div>
</div>

<div class="app hidden" id="app-root">
  <nav class="sidebar">
    <div class="tabs" id="tabs"></div>
    <div class="logo">
      <div class="co">Ангрен Каолин</div>
      <div class="sub">учёт перевозок и расчётов</div>
    </div>
    <div class="nav" id="nav"></div>
    <div class="side-bottom">
      <div class="who" id="who"></div>
      <button onclick="doLogout()">Выйти</button>
    </div>
  </nav>
  <main class="main" id="main"></main>
</div>

<div class="modal-bg" id="modal-bg"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="ak-docs.js?v=2026-11-26-2"></script>
<script>
'use strict';
const SUPABASE_URL = 'https://otzerelogdbinclmalyp.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im90emVyZWxvZ2RiaW5jbG1hbHlwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQwNDMwMTYsImV4cCI6MjA5OTYxOTAxNn0.lpg3sKw2cLt1qzgDHKyn6Kon26-7sqUGtZeoTN6ZIB0';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const MM_URL = '../';

// ================= состояние =================
const S = {
  user: null, me: null,
  members: [], carriers: [], vehicles: [], owners: [], routes: [], directors: [],
  wallets: [], opening: [], settings: {}, audit: [],
  rates: [], requests: [], trips: [], reqCalc: [], tripCalc: [], carrierCalc: [], deductions: [], adjustments: [], sumAll: {}, partners: {}, calcPeriod: 'quarter',
  reqCalcBy: new Map(), tripCalcBy: new Map(), carrierCalcBy: new Map(), movements: [], losses: [], expenses: [], expenseLinks: [], balances: [],
  reversedIds: new Set(),
  page: 'overview', showArchived: false, search: { carriers: '', vehicles: '', requests: '' }, auditTable: '',
  reqFilter: 'active', tripFilter: 'active', mvWallet: '',
};
const canEdit = () => S.me && S.me.role === 'owner';

// ================= утилиты =================
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const CUR = { UZS: 'сум', USD: '$' };

// Деньги — целые минимальные единицы (тийин/цент). Никакого float.
function fmtMoney(minor, cur) {
  if (minor === null || minor === undefined || minor === '') return '';
  const n = BigInt(minor);
  const neg = n < 0n;
  const a = neg ? -n : n;
  const whole = (a / 100n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
  const frac = (a % 100n).toString().padStart(2, '0');
  return (neg ? '−' : '') + whole + (frac === '00' ? '' : ',' + frac) + (cur ? ' ' + CUR[cur] : '');
}
// «102 985 000», «1500,5», «-200» → минимальные единицы (Number, но только целые) или NaN
function parseMoney(str) {
  const s = String(str ?? '').replace(/[\s ]/g, '').replace(/[−–]/g, '-').replace(',', '.');
  const m = s.match(/^(-?)(\d+)(?:\.(\d{1,2}))?$/);
  if (!m) return NaN;
  const minor = BigInt(m[2]) * 100n + BigInt((m[3] || '').padEnd(2, '0'));
  const v = m[1] ? -minor : minor;
  if (v > BigInt(Number.MAX_SAFE_INTEGER) || -v > BigInt(Number.MAX_SAFE_INTEGER)) return NaN;
  return Number(v);
}
const minorToInput = (minor) => (minor === null || minor === undefined) ? '' : fmtMoney(minor).replace('−', '-');
const fmtDate = (iso) => { if (!iso) return ''; const [y, m, d] = String(iso).slice(0, 10).split('-'); return `${d}.${m}.${y}`; };
const fmtDateTime = (iso) => { const d = new Date(iso); return d.toLocaleString('ru-RU', { timeZone: 'Asia/Tashkent', day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' }); };
const normPlate = (p) => String(p || '').toUpperCase().replace(/[\s\-.]/g, '').replace(/[АВЕКМНОРСТУХ]/g, (c) => 'ABEKMHOPCTYX'['АВЕКМНОРСТУХ'.indexOf(c)]);
const todayIso = () => new Date().toLocaleDateString('sv-SE', { timeZone: 'Asia/Tashkent' });

function toast(msg, bad) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast show' + (bad ? ' bad' : '');
  clearTimeout(toast._t); toast._t = setTimeout(() => { t.className = 'toast'; }, bad ? 6000 : 2600);
}
function humanError(e) {
  const m = (e && (e.message || e.error_description)) || String(e);
  if (/ak_carriers_inn_uniq/.test(m)) return 'Перевозчик с таким ИНН уже есть.';
  if (/ak_vehicles_plate_uniq/.test(m)) return 'Машина с таким госномером уже есть.';
  if (/ak_routes_name_uniq/.test(m)) return 'Маршрут с таким названием уже есть.';
  if (/ak_vehicle_owners_vehicle_id_valid_from_key/.test(m)) return 'На эту дату у машины уже указан владелец.';
  if (/ak_requests_route_day/.test(m)) return 'На это направление и дату погрузки уже есть заявка — добавьте машину в неё.';
  if (/ak_movements_reversed_once/.test(m)) return 'Эта запись уже отменена.';
  if (/row-level security|permission denied/i.test(m)) return 'Нет прав на это действие.';
  if (/Failed to fetch|NetworkError/i.test(m)) return 'Нет связи с сервером. Проверьте интернет.';
  return m;
}
// Любая запись — с причиной в журнал (заголовок x-ak-reason, читает триггер ak_audit).
async function dbRun(builder, reason) {
  if (reason && typeof builder.setHeader === 'function') builder = builder.setHeader('x-ak-reason', encodeURIComponent(reason));
  const { data, error } = await builder;
  if (error) throw error;
  return data;
}

// ================= вход =================
function showLoginError(msg) { const e = document.getElementById('login-error'); e.textContent = msg; e.style.display = msg ? 'block' : 'none'; }
async function doLogin() {
  const btn = document.getElementById('login-btn');
  btn.disabled = true; showLoginError('');
  const { data, error } = await sb.auth.signInWithPassword({
    email: document.getElementById('login-email').value.trim(),
    password: document.getElementById('login-password').value,
  });
  btn.disabled = false;
  if (error) { showLoginError(/Invalid login/i.test(error.message) ? 'Неверный email или пароль.' : humanError(error)); return; }
  enter(data.session);
}
async function doLogout() { await sb.auth.signOut(); location.reload(); }

async function enter(session) {
  S.user = session.user;
  const { data: me, error } = await sb.from('ak_members').select('*').eq('user_id', S.user.id).maybeSingle();
  if (error || !me || !me.active) {
    document.getElementById('login-box').innerHTML =
      '<div class="co">Ангрен Каолин</div><div class="sub">нет доступа</div>' +
      '<div class="err" style="display:block;">У этого аккаунта нет доступа к блоку «Ангрен Каолин».</div>' +
      `<div style="display:flex;gap:8px;"><a class="btn" href="${MM_URL}">← ММ Транспорт</a><button class="btn" onclick="doLogout()">Выйти</button></div>`;
    return;
  }
  S.me = me;
  document.getElementById('login-box').innerHTML = '<div class="co">Ангрен Каолин</div><div class="sub">загружаем данные…</div>';
  try { await loadAll(); } catch (e) {
    document.getElementById('login-box').innerHTML = '<div class="co">Ангрен Каолин</div><div class="err" style="display:block;">Не удалось загрузить данные: ' + esc(humanError(e)) + '<br>Обновите страницу (F5).</div>';
    return;
  }
  document.getElementById('login-screen').classList.add('hidden');
  document.getElementById('app-root').classList.remove('hidden');
  // Вкладка «ММ Транспорт» — только владельцу; у партнёра доступа к ММ Транспорт нет.
  document.getElementById('tabs').innerHTML =
    (me.role === 'owner' ? `<a href="${MM_URL}">ММ Транспорт</a>` : '') + '<a class="on">Ангрен Каолин</a>';
  document.getElementById('who').innerHTML = esc(me.display_name) + (canEdit() ? '' : ' · только просмотр');
  const hash = location.hash.replace('#', '');
  go(PAGES.some((p) => p.id === hash) ? hash : 'overview');
}

// Сервер отдаёт не больше 1000 строк за запрос — читаем страницами, чтобы с ростом
// данных (движения, рейсы) ничего молча не пропадало.
async function fetchAll(table, order, asc = true) {
  const out = [];
  for (let from = 0; ; from += 1000) {
    let b = sb.from(table).select('*');
    if (order) b = b.order(order, { ascending: asc });
    const { data, error } = await b.range(from, from + 999);
    if (error) throw error;
    out.push(...data);
    if (data.length < 1000) return out;
  }
}
async function loadAll() {
  const T = [
    ['members', 'ak_members', 'display_name'], ['carriers', 'ak_carriers', 'name'], ['vehicles', 'ak_vehicles', 'plate_norm'],
    ['owners', 'ak_vehicle_owners', 'valid_from'], ['routes', 'ak_routes', 'name'], ['directors', 'ak_directors', 'valid_from'],
    ['wallets', 'ak_wallets', 'sort_order'], ['opening', 'ak_opening_balances', 'created_at'], ['settingsRows', 'ak_settings', 'key'],
    ['rates', 'ak_fx_rates', 'rate_date'], ['requests', 'ak_requests', 'loading_date'], ['trips', 'ak_trips', 'created_at'],
    ['movements', 'ak_movements', 'created_at'], ['losses', 'ak_movement_losses', 'id'], ['expenses', 'ak_expenses', 'exp_date'],
    ['expenseLinks', 'ak_expense_requests', 'expense_id'], ['balances', 'ak_wallet_balances', 'wallet_id'],
    ['reqCalc', 'ak_request_calc', 'request_id'], ['tripCalc', 'ak_trip_calc_uzs', 'trip_id'], ['carrierCalc', 'ak_carrier_calc', 'carrier_id'],
    ['deductions', 'ak_trip_deductions', 'created_at'], ['adjustments', 'ak_factory_adjustments', 'created_at'],
  ];
  const res = await Promise.all(T.map(([, t, o]) => fetchAll(t, o)));
  T.forEach(([k], i) => { S[k] = res[i]; });
  S.settings = Object.fromEntries(S.settingsRows.map((r) => [r.key, r.value]));
  S.reversedIds = new Set(S.movements.filter((m) => m.reverses_id).map((m) => m.reverses_id));
  S.reqCalcBy = new Map(S.reqCalc.map((x) => [x.request_id, x]));
  S.tripCalcBy = new Map(S.tripCalc.map((x) => [x.trip_id, x]));
  S.carrierCalcBy = new Map(S.carrierCalc.map((x) => [x.carrier_id, x]));
  const [sumRes, partRes] = await Promise.all([sb.rpc('ak_summary'), sb.rpc('ak_partners')]);
  if (sumRes.error) throw sumRes.error;

// Поле формы. f = {k, label, type, opts, val, hint, full, req}
function field(f) {
  const dis = canEdit() ? '' : ' disabled';
  const id = 'f_' + f.k;
  const cls = 'fr' + (f.full ? ' full' : '') + (f.type === 'check' ? ' chk' : '');
  let inp;
  if (f.type === 'select') inp = `<select id="${id}"${dis}>${Object.entries(f.opts).map(([v, t]) => `<option value="${esc(v)}"${String(f.val ?? '') === v ? ' selected' : ''}>${esc(t)}</option>`).join('')}</select>`;
  else if (f.type === 'check') return `<div class="${cls}"><label><input type="checkbox" id="${id}"${f.val ? ' checked' : ''}${dis}> ${esc(f.label)}</label>${f.hint ? `<div class="hint">${esc(f.hint)}</div>` : ''}</div>`;
  else if (f.type === 'textarea') inp = `<textarea id="${id}"${dis}>${esc(f.val)}</textarea>`;
  else inp = `<input id="${id}" type="${f.type || 'text'}" value="${esc(f.val)}"${f.type === 'money' ? ' inputmode="decimal"' : ''}${dis}>`.replace('type="money"', 'type="text"');
  return `<div class="${cls}"><label>${esc(f.label)}${f.req ? ' *' : ''}</label>${inp}${f.hint ? `<div class="hint">${esc(f.hint)}</div>` : ''}</div>`;
}
const val = (k) => { const el = document.getElementById('f_' + k); if (!el) return undefined; return el.type === 'checkbox' ? el.checked : el.value.trim(); };
const valOrNull = (k) => { const v = val(k); return v === '' ? null : v; };
const reasonField = (isEdit) => isEdit && canEdit() ? field({ k: 'reason', label: 'Причина изменения (для журнала)', full: true, hint: 'Необязательно, но помогает потом понять, зачем меняли.' }) : '';
const modalActions = (saveFn, extra = '') => `<div class="actions">${extra}<button class="btn" onclick="closeModal()">${canEdit() ? 'Отмена' : 'Закрыть'}</button>${canEdit() ? `<button class="btn primary" id="save-btn" onclick="${saveFn}">Сохранить</button>` : ''}</div>`;
// after — что открыть после сохранения (например, вернуться в карточку заявки).
async function saving(fn, after, okMsg) {
  const b = document.getElementById('save-btn'); if (b) b.disabled = true;
  try {
    const res = await fn(); closeModal(); await reload(); toast(okMsg || 'Сохранено');
    if (after) after(res);
  } catch (e) { toast(humanError(e), true); if (b) b.disabled = false; }
}
// Обновить только реально изменившиеся поля (чтобы журнал был чистым).
function changed(row, upd) { const out = {}; for (const [k, v] of Object.entries(upd)) if ((row[k] ?? null) !== (v ?? null)) out[k] = v; return out; }
async function saveRow(table, row, upd, keyCol = 'id') {
  const reason = valOrNull('reason');
  if (row) {
    const diff = changed(row, upd);
    if (!Object.keys(diff).length) return;
    await dbRun(sb.from(table).update(diff).eq(keyCol, row[keyCol]), reason);
  } else {
    return dbRun(sb.from(table).insert(upd).select().single());
  }
}

function parseRate(s) {
  const t = String(s ?? '').replace(/[\s ]/g, '').replace(',', '.');
  return /^\d+(\.\d{1,2})?$/.test(t) && Number(t) > 0 ? t : null;
}
const rateOn = (d) => { let r = null; for (const x of S.rates) if (x.rate_date <= d) r = x; return r; };
const VAT_BP = () => (S.settings.tax || {}).vat_rate_bp || 1200;
const vatOf = (gross) => Math.round(gross * VAT_BP() / (10000 + VAT_BP()));   // НДС внутри суммы с НДС
const netOfVat = (gross) => gross - vatOf(gross);
const reqLabel = (r) => r ? (r.number ? '№ ' + r.number : 'черновик') : '—';
const reqTitle = (r) => r ? `${reqLabel(r)} · ${(routeById(r.route_id) || {}).name || ''} · ${fmtDate(r.loading_date)}` : '—';
const tripsOf = (reqId) => S.trips.filter((t) => t.request_id === reqId).sort((a, b) => a.created_at < b.created_at ? -1 : 1);
// машин в заявке по факту = заполненные лоты (решение владельца: подтверждение завода не используется)
const reqTrucks = (r) => N((S.reqCalcBy.get(r.id) || {}).trucks);

  const lotRow = (t, i) => {
    const c = carrierById(t.carrier_id);
    const col = tripColor(t);
    return `<tr class="click" style="background:${COLOR[col][0]};" onclick="editTrip('${t.id}')">
      <td style="width:28px;">${i + 1}</td>
      <td class="mono">${t.tractor_id ? esc(plates(t)) : '<span style="color:var(--red);">свободный лот — выбрать машину</span>'}</td>
      <td>${c ? esc(c.name) + (c.partner_key ? ' <span class="tag blue">партнёр</span>' : '') : '<span class="muted">—</span>'}</td>
      <td class="num">${t.price_minor != null ? fmtMoney(t.price_minor, t.price_cur) : '<span class="muted">—</span>'}${t.price_cur === 'USD' && t.price_uzs_minor ? `<div class="muted">${fmtMoney(t.price_uzs_minor, 'UZS')}</div>` : ''}</td>
      <td>${t.pay_timing ? esc(LBL.pay_timing[t.pay_timing]) + ', ' + esc(LBL.pay_method[t.pay_method] || '') : '<span class="muted">—</span>'}</td>
      ${payCell(t)}
      <td>${tripColorTag(t)} ${t.status !== 'assigned' && t.status !== 'cancelled' ? tag(STATUS_TRIP[t.status]) : ''}</td>
      <td class="mono" style="white-space:nowrap;">${lotPdfBtn(t)}</td></tr>`;
  };
  const blocks = reqs.map((r) => {
    const lots = tripsOf(r.id).filter((t) => t.status !== 'cancelled');
    const cnt = { red: 0, yellow: 0, green: 0, grey: 0 }; lots.forEach((t) => cnt[tripColor(t)]++);
    return `<div class="card" style="padding:0;overflow:hidden;">
      <div class="toolbar" style="margin:0;padding:10px 14px;background:var(--surface2);border-bottom:1px solid var(--border);cursor:pointer;" onclick="editRequest('${r.id}')">
        <b>${esc((routeById(r.route_id) || {}).name)}</b> · ${fmtDate(r.loading_date)} · заявка ${esc(reqLabel(r))} ${reqReadyTag(r)}
        <span class="grow"></span><span style="font-size:12px;">${cnt.red ? '🔴 ' + cnt.red + ' ' : ''}${cnt.yellow ? '🟡 ' + cnt.yellow + ' ' : ''}${cnt.green ? '🟢 ' + cnt.green : ''}</span>
      </div>
      <table><thead><tr><th>#</th><th>Тягач / прицеп</th><th>Перевозчик</th><th class="num">Цена</th><th>Условия</th><th class="num">Оплачено</th><th></th><th>Состояние</th><th>№ заявки</th></tr></thead>
      <tbody>${lots.map(lotRow).join('') || '<tr><td colspan="9" class="empty">лотов нет</td></tr>'}</tbody></table>
      ${canEdit() && r.status !== 'cancelled' ? `<div style="padding:8px 14px;"><button class="btn small" onclick="addLot('${r.id}')">+ ещё лот</button></div>` : ''}
    </div>`;
  }).join('');
  const filt = { active: 'текущие (есть незакрытые или свежие)', all: 'все заявки' };
  return `<h1>Рейсы — лоты${roBadge()}</h1>
  <div class="lead">На каждую машину заявки завода сразу открывается лот. Выберите машину (или добавьте новую «+»), перевозчик, прицеп и условия подставятся сами. 🔴 — не хватает машины, цены или условий; 🟡 — всё заполнено, ждёт оплаты; 🟢 — оплачено.</div>
  <div class="toolbar"><select style="max-width:300px;" onchange="S.tripFilter=this.value;render()">${Object.entries(filt).map(([k, v]) => `<option value="${k}"${f === k ? ' selected' : ''}>${v}</option>`).join('')}</select>
    ${canEdit() ? '<span class="grow"></span><button class="btn primary" onclick="editRequest()">+ Заявка завода</button>' : ''}</div>
  ${blocks || '<div class="card empty">Заявок нет — начните с «+ Заявка завода».</div>'}`;
};
// Лишняя машина сверх заявки: увеличиваем «заказано» — лот откроется сам.
async function addLot(reqId) {
  const r = reqById(reqId);
  if (!confirm(`Добавить ещё одну машину в заявку ${reqLabel(r)}? «Машин заказано» станет ${(r.trucks_ordered || 0) + 1}.`)) return;
  try { await dbRun(sb.from('ak_requests').update({ trucks_ordered: (r.trucks_ordered || 0) + 1 }).eq('id', reqId), 'добавлен лот'); await reload(); toast('Лот добавлен'); }
  catch (e) { toast(humanError(e), true); }
}

// Подставить умолчания перевозчика (цена с/без НДС, валюта, условия оплаты).
function tripCarrierChanged(fillAll) {
  const r = reqById(currentTripRequestId());
  const c = carrierById(val('carrier_id'));
  if (!c) return;
  if (r.kind === 'local') {
    const vatEl = document.getElementById('f_vat_included'); if (vatEl) vatEl.checked = !!c.vat_payer;
    if (fillAll || !val('price')) setVal('price', minorToInput(c.vat_payer ? r.price_uzs_minor : netOfVat(r.price_uzs_minor)));
  } else if (fillAll) {
    setVal('price_cur', c.price_fixed_uzs ? 'UZS' : 'USD');
  }
  if (fillAll) { setVal('pay_timing', c.pay_timing); setVal('pay_method', c.pay_method); setVal('pay_days', c.pay_days); }
  tripPreview();
}
const currentTripRequestId = () => S.tripReq;
// «+» у тягача / прицепа: новая машина, которой нет в списке. Запишется в справочник
// за выбранным перевозчиком при сохранении рейса.
function newVehicleInTrip(kind) {
  const plate = prompt(kind === 'tractor' ? 'Госномер нового тягача:' : 'Госномер нового прицепа:');
  if (!plate) return;
  const p = normPlate(plate);
  if (S.vehicles.some((x) => x.plate_norm === p)) { toast(`${p} уже есть в списке — выбрана`); }
  setVal(kind, p);
  if (kind === 'tractor') { document.getElementById('f_trailer').dataset.auto = ''; tripPlateChanged(); }
  const hint = document.getElementById('plate-hint');
  if (!S.vehicles.some((x) => x.plate_norm === p)) hint.innerHTML = `<span style="color:var(--amber);">Новая машина ${esc(p)} — выберите перевозчика ниже: при сохранении машина добавится в справочник за ним.</span>`;
}
function tripPlateChanged() {
  const r = reqById(currentTripRequestId());
  const p = normPlate(val('tractor'));
  const hint = document.getElementById('plate-hint');
  if (!p) { hint.textContent = ''; return; }
  const veh = S.vehicles.find((x) => x.plate_norm === p);
  if (!veh) { hint.innerHTML = `<span style="color:var(--amber);">Новая машина ${esc(p)} — при сохранении добавится в справочник за выбранной фирмой.</span>`; return; }
  const o = currentOwner(veh.id, r.loading_date);
  const c = o && carrierById(o.carrier_id);
  // свой прицеп тягача (или из последнего рейса); подставляем, если поле пустое
  // или в нём прицеп, подставленный автоматически для прежнего тягача
  const own = vehById(veh.default_trailer_id) ||
    vehById((S.trips.filter((x) => x.tractor_id === veh.id && x.trailer_id).sort((a, b) => a.created_at < b.created_at ? 1 : -1)[0] || {}).trailer_id);
  const trEl = document.getElementById('f_trailer');
  if (!trEl.value || trEl.dataset.auto === trEl.value) { trEl.value = own ? own.plate_norm : ''; trEl.dataset.auto = trEl.value; }
  const trailerNote = own ? ` Свой прицеп: <b>${esc(own.plate_norm)}</b> — подставлен, можно заменить.` : '';
  if (c) {
    hint.innerHTML = `На ${fmtDate(r.loading_date)} машина у фирмы <b>${esc(c.name)}</b>.${trailerNote}`;
    if (!val('carrier_id')) { setVal('carrier_id', c.id); tripCarrierChanged(true); }
  } else hint.innerHTML = 'Машина в справочнике, но не привязана к фирме — выберите перевозчика.' + trailerNote;
}
// Перевозчик в рейсе ≠ владелец машины в справочнике на дату погрузки.
// Владелец в справочнике меняется ТОЛЬКО если явно поставить галочку.
function ownerMismatch() {
  const r = reqById(currentTripRequestId());
  const veh = S.vehicles.find((x) => x.plate_norm === normPlate(val('tractor')));
  const cid = val('carrier_id');
  if (!r || !veh || !cid) return null;
  const o = currentOwner(veh.id, r.loading_date);
  if (!o || o.carrier_id === cid) return null;
  return { veh, owner: carrierById(o.carrier_id), chosen: carrierById(cid), date: r.loading_date };
}
function ownerCheck() {
  const box = document.getElementById('owner-warn'); if (!box) return;
  const m = ownerMismatch();
  if (!m) { box.style.display = 'none'; box.innerHTML = ''; return; }
  const keep = document.getElementById('f_owner_moved')?.checked;
  box.style.display = '';
  box.innerHTML = `<div class="note amber" style="margin:0;">⚠ Машина <b>${esc(m.veh.plate_norm)}</b> в справочнике записана за <b>${esc(m.owner.name)}</b>, а в рейсе выбран <b>${esc(m.chosen.name)}</b>.<br>
    Если перевозчику платите наличными — выберите настоящего перевозчика и «Как платим: наличные»; заявка перевозчику всё равно оформляется на реального исполнителя.
    ${canEdit() ? `<div style="margin-top:6px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;"><button class="btn small" type="button" onclick="setVal('carrier_id','${m.owner.id}');tripCarrierChanged(false);ownerCheck();tripPreview();">Выбрать «${esc(m.owner.name)}»</button>
      <label style="display:flex;gap:6px;align-items:center;font-size:12.5px;"><input type="checkbox" id="f_owner_moved"${keep ? ' checked' : ''}> Машина действительно перешла к «${esc(m.chosen.name)}» с ${fmtDate(m.date)} (изменить владельца в справочнике)</label></div>` : ''}</div>`;
}
function tripPreview() {
  const box = document.getElementById('trip-preview'); if (!box) return;
  const r = reqById(currentTripRequestId()); if (!r) return;
  const price = parseMoney(val('price'));
  const lines = [];
  if (!Number.isNaN(price) && val('price')) {
    const cur = r.kind === 'local' ? 'UZS' : val('price_cur');
    const rate = parseRate(val('fx_rate')) || r.fx_rate;
    const uzs = cur === 'USD' ? Math.round(price * Number(rate)) : price;
    lines.push(`Цена перевозчику: <b>${fmtMoney(uzs, 'UZS')}</b>${cur === 'USD' ? ` (${fmtMoney(price, 'USD')} × ${fmtRate(rate)})` : ''}`);
    if (r.kind === 'local') {
      const vatIn = document.getElementById('f_vat_included')?.checked;
      lines.push(vatIn ? `в т. ч. НДС ${fmtMoney(vatOf(uzs), 'UZS')} (к зачёту)` : 'без НДС');
      lines.push(`Заводу за эту машину (с НДС): ${fmtMoney(r.price_uzs_minor, 'UZS')}, без НДС: ${fmtMoney(netOfVat(r.price_uzs_minor), 'UZS')}`);
    } else {
      lines.push(`Завод платит за машину: ${fmtMoney(r.price_uzs_minor, 'UZS')} · оформление ${fmtMoney(r.oformlenie_minor, 'USD')}`);
    }
  }
  const c = carrierById(val('carrier_id'));
  if (c && c.partner_key) lines.push(`Машина партнёра (${esc(LBL.partner[c.partner_key])}): заявка оформляется на MM, оплата — ему лично.`);
  box.innerHTML = lines.join('<br>') || 'Укажите перевозчика и цену.';
}
async function ensureVehicle(plate, kind, carrierId, fromDate) {
  const p = normPlate(plate);
  if (!p) return null;
  let veh = S.vehicles.find((x) => x.plate_norm === p);
  if (!veh) {
    if (!carrierId) throw new Error(`Машина ${p} новая — выберите перевозчика, за которым её записать`);
    veh = await dbRun(sb.from('ak_vehicles').insert({ plate: p, kind }).select().single());
    await dbRun(sb.from('ak_vehicle_owners').insert({ vehicle_id: veh.id, carrier_id: carrierId, valid_from: fromDate }));
    S.vehicles.push(veh);
  }
  return veh;
}
function saveTrip(id, requestId) {
  const t = id ? tripById(id) : null;
  const r = reqById(requestId);
  const local = r.kind === 'local';
  const priceStr = val('price');
  const price = priceStr ? parseMoney(priceStr) : null;
  if (priceStr && !(price >= 0)) return toast('Цена — число', true);
  const cur = local ? 'UZS' : val('price_cur');
  const rate = local ? null : parseRate(val('fx_rate'));
  if (!local && cur === 'USD' && val('fx_rate') && !rate) return toast('Курс — число', true);
  const carrierId = valOrNull('carrier_id');
  const status = val('status');
  if (status === 'failed' && !val('failed_reason')) { document.querySelector('#modal details.more').open = true; return toast('Укажите причину, почему рейс не состоялся', true); }
  const mm = ownerMismatch();
  const moved = !!document.getElementById('f_owner_moved')?.checked;
  if (mm && !moved && !confirm(`Сохранить рейс с перевозчиком «${mm.chosen.name}»?\nМашина ${mm.veh.plate_norm} в справочнике остаётся за «${mm.owner.name}».`)) return;
  saving(async () => {
    const tractor = await ensureVehicle(val('tractor'), 'tractor', carrierId, r.loading_date);
    const trailer = await ensureVehicle(val('trailer'), 'trailer', carrierId, r.loading_date);
    // машина записана за другой фирмой: владелец меняется ТОЛЬКО по галочке
    if (tractor && carrierId) {
      const o = currentOwner(tractor.id, r.loading_date);
      if (o && o.carrier_id !== carrierId && moved) {
        await dbRun(sb.from('ak_vehicle_owners').insert({ vehicle_id: tractor.id, carrier_id: carrierId, valid_from: r.loading_date }), 'машина перешла к другой фирме (отмечено при оформлении рейса)');
      }
    }
    const upd = {
      request_id: r.id, tractor_id: tractor ? tractor.id : null, trailer_id: trailer ? trailer.id : null, carrier_id: carrierId,
      price_minor: price, price_cur: price === null ? null : cur, fx_rate: cur === 'USD' ? (rate || r.fx_rate) : null,
      vat_included: local ? !!val('vat_included') : false,
      pay_timing: valOrNull('pay_timing'), pay_method: valOrNull('pay_method'), pay_days: val('pay_days') === '' ? null : parseInt(val('pay_days'), 10),
      status, loaded_on: valOrNull('loaded_on'), delivered_on: valOrNull('delivered_on'),
      failed_reason: valOrNull('failed_reason'), notes: valOrNull('notes'),
    };
    const saved = await saveRow('ak_trips', t, upd);
    // поставили другой прицеп — он становится парой тягача
    if (tractor && trailer && tractor.default_trailer_id !== trailer.id) {
      await dbRun(sb.from('ak_vehicles').update({ default_trailer_id: trailer.id }).eq('id', tractor.id),
        `новый прицеп ${trailer.plate_norm} у тягача ${tractor.plate_norm} (рейс ${reqLabel(r)})`);
    }
    return saved;
  }, null, 'Лот сохранён');
}

const PAY_WAY = { order: 'Платёжное поручение (комиссия 0,1% + 1 120 — посчитается сама)', bank_debit: 'Списано банком (без комиссии)' };

// Показать нужные поля под выбранный кошелёк / плательщика.
// payer: id кошелька или 'p:ismat' / 'p:sarvar' (лично — фин. помощь).
function payWaySync(payer) {
  const w = walletById(payer);
  const personal = String(payer || '').startsWith('p:');
  const show = (k, on) => { const el = document.getElementById('f_' + k); if (el) el.closest('.fr').style.display = on ? '' : 'none'; return el; };
  show('pay_way', w && w.kind === 'bank');
  const card = show('via_card', w && w.kind === 'cash');
  const feeOn = personal || (w && w.kind === 'cash' && card && card.checked);
  const fee = show('card_fee', feeOn);
  if (fee) {
    fee.closest('.fr').querySelector('label').textContent = personal ? 'Комиссия карты (если платили картой)' : 'Комиссия карты';
    if (!feeOn) fee.value = '';
  }
  if (card && !(w && w.kind === 'cash')) card.checked = false;
}
function cardFee() { const s = val('card_fee'); if (!s) return 0; const n = parseMoney(s); return Number.isNaN(n) ? NaN : n; }
// Параметры движения: способ списания с Р/С и комиссия личной карты.
function applyPayWay(p, walletId) {
  const w = walletById(walletId);
  if (w && w.kind === 'bank' && val('pay_way') === 'bank_debit') p.bank_debit = true;
  const fee = cardFee();
  if (fee) p.losses.push({ kind: 'bank_fee', amount: fee, note: 'комиссия личной карты' });
  if (w && w.kind === 'cash' && val('via_card')) p.note = [p.note, 'оплачено с личной карты, возмещено из кассы'].filter(Boolean).join(' · ');
  return p;
}
const PAY_OUT_OPS = ['carrier_payment', 'oformlenie_payment', 'partner_withdrawal', 'help_return'];
function opParams(op) {
  const p = { op_date: val('op_date'), note: valOrNull('note') };
  const money = (k) => { const s = val(k); if (!s) return null; const n = parseMoney(s); return Number.isNaN(n) ? NaN : n; };
  p.kind = { via_counterparty: 'transfer', exchange: 'transfer' }[op] || op;
  if (op === 'via_counterparty') p.from_wallet = 'rs';
  for (const k of ['from_wallet', 'to_wallet', 'carrier_id', 'trip_id', 'request_id', 'partner_key', 'counterparty']) {
    const el = document.getElementById('f_' + k); if (el && el.value) p[k] = el.value.trim();
  }
  p.amount_in = money('amount_in');
  const out = money('amount_out'); if (out !== null) p.amount_out = out;
  p.losses = [['third_party_fee', 'loss_third'], ['cash_delivery', 'loss_delivery'], ['other', 'loss_other']]
    .map(([kind, k]) => ({ kind, amount: money(k) })).filter((l) => l.amount);
  if (op === 'handover') p.in_transit = !val('received');
  if (PAY_OUT_OPS.includes(op)) applyPayWay(p, p.from_wallet);
  return p;
}
// Назначение платежа перевозчику (перечисление с Р/С). Формат — как пишет бухгалтер:
// «Оплата за перевозку грузов автомобильным транспортом в международном сообщении по
// маршруту: Ангрен - Ишимбай (АТС:01605СМА, перевозка от 26.11.2026).»
// «Частичная оплата» — если сумма меньше остатка по рейсу; «Оплата» — целиком или остаток.
function paymentPurpose(t, amount, walletId) {
  const r = reqById(t.request_id) || {};
  const route = (routeById(r.route_id) || {}).name || '';
  const plate = (vehById(t.tractor_id) || {}).plate_norm || '—';
  const date = fmtDate(t.loaded_on || r.loading_date);
  const rest = tripPayDefaults(t, walletId).amount;
  const partial = rest != null && amount < rest;
  const scope = r.kind === 'local' ? 'междугородном' : 'международном';
  return `${partial ? 'Частичная оплата' : 'Оплата'} за перевозку грузов автомобильным транспортом в ${scope} сообщении по маршруту: Ангрен - ${route} (АТС:${plate}, перевозка от ${date}).`;
}
function updatePurpose(op, p) {
  const box = document.getElementById('purpose-box'); if (!box) return;
  const w = walletById(p.from_wallet), t = tripById(p.trip_id);
  const show = op === 'carrier_payment' && w && w.kind === 'bank' && t && p.amount_in > 0;
  box.style.display = show ? '' : 'none';
  document.getElementById('purpose-text').textContent = show ? paymentPurpose(t, p.amount_in, w.id) : '';
}
async function copyPurpose() {
  const txt = document.getElementById('purpose-text').textContent;
  try { await navigator.clipboard.writeText(txt); toast('Назначение скопировано'); }
  catch (e) { const r = document.createRange(); r.selectNodeContents(document.getElementById('purpose-text')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast('Выделено — нажмите Ctrl+C'); }
}
function opPreview(op) {
  const box = document.getElementById('op-preview'); if (!box) return;
  const p = opParams(op);
  const wf = walletById(p.from_wallet), wt = walletById(p.to_wallet);
  const lines = [];
  if (wf && !p.amount_in) { box.innerHTML = `В «${esc(wf.name)}» сейчас: <b>${fmtMoney((S.balances.find((b) => b.wallet_id === wf.id) || {}).balance_minor || 0, wf.currency)}</b>`; return; }
  if (!(p.amount_in > 0)) { box.innerHTML = 'Укажите сумму.'; updatePurpose(op, p); return; }
  const curOut = wf && wf.currency, curIn = wt ? wt.currency : curOut;
  const manual = p.losses.reduce((a, l) => a + (l.amount || 0), 0);
  let base = p.amount_out ?? (wf ? p.amount_in + manual : null);
  let fee = 0;
  if (wf && op === 'cash_withdrawal') { fee = Math.round(p.amount_in * 0.005); lines.push(`Комиссия за снятие 0,5%: ${fmtMoney(fee, 'UZS')}`); }
  else if (wf && wf.kind === 'bank' && base && !p.bank_debit) { fee = Math.round(base * 0.001) + 112000; lines.push(`Комиссия банка за поручение (0,1% + 1 120): ${fmtMoney(fee, 'UZS')}`); }
  if (wf && curIn !== curOut && p.amount_out) {
    const cbu = rateOn(p.op_date);
    if (cbu) {
      const conv = curOut === 'UZS' ? Math.round(p.amount_in * Number(cbu.usd_uzs)) : Math.round(p.amount_in / Number(cbu.usd_uzs));
      const diff = p.amount_out - manual - conv;
      const real = curOut === 'UZS' ? (p.amount_out - manual) / p.amount_in : p.amount_in / (p.amount_out - manual);
      lines.push(`Реальный курс: ${fmtRate(real.toFixed(2))} · курс ЦБ ${fmtRate(cbu.usd_uzs)} · курсовая разница: ${fmtMoney(diff, curOut)} ${diff < 0 ? '(выгода)' : ''}`);
    } else lines.push('<span style="color:var(--red);">Нет курса ЦБ на эту дату — загрузите на странице «Курсы ЦБ».</span>');
  }
  if (wf && base) {
    const after = ((S.balances.find((b) => b.wallet_id === wf.id) || {}).balance_minor || 0) - base - fee;
    lines.push(`Спишется из «${esc(wf.name)}»: <b>${fmtMoney(base + fee, curOut)}</b> · останется ${after < 0 ? `<b style="color:var(--red);">${fmtMoney(after, curOut)} — не хватает денег</b>` : fmtMoney(after, curOut)}`);
  }

}

// ---------- рабочие дни (сб, вс — выходные; праздники пока не учитываются) ----------
function addWorkdays(iso, n) {
  const d = new Date(iso + 'T00:00:00Z');
  let left = Number(n || 0);
  while (left > 0) { d.setUTCDate(d.getUTCDate() + 1); const wd = d.getUTCDay(); if (wd !== 0 && wd !== 6) left--; }
  return d.toISOString().slice(0, 10);
}

// ---------- период ----------
function periodRange(p) {
  const today = todayIso(); const y = +today.slice(0, 4); const m = +today.slice(5, 7);
  const pad = (x) => String(x).padStart(2, '0');
  const last = (yy, mm) => new Date(Date.UTC(yy, mm, 0)).toISOString().slice(0, 10);
  const q = Math.floor((m - 1) / 3);
  switch (p) {
    case 'month': return [`${y}-${pad(m)}-01`, last(y, m)];
    case 'prev_month': { const pm = m === 1 ? 12 : m - 1, py = m === 1 ? y - 1 : y; return [`${py}-${pad(pm)}-01`, last(py, pm)]; }
    case 'quarter': return [`${y}-${pad(q * 3 + 1)}-01`, last(y, q * 3 + 3)];
    case 'prev_quarter': { const pq = q === 0 ? 3 : q - 1, py = q === 0 ? y - 1 : y; return [`${py}-${pad(pq * 3 + 1)}-01`, last(py, pq * 3 + 3)]; }
    case 'year': return [`${y}-01-01`, `${y}-12-31`];
    default: return [null, null];
  }
}
const PERIODS = { quarter: 'текущий квартал', prev_quarter: 'прошлый квартал', month: 'текущий месяц', prev_month: 'прошлый месяц', year: 'текущий год', all: 'всё время' };

}

function safeToTake() {
  const rate = N((rateOn(todayIso()) || {}).usd_uzs);
  const wallets = S.balances.reduce((a, b) => a + (b.currency === 'USD' ? Math.round(N(b.balance_minor) * rate) : N(b.balance_minor)), 0);
  const carriers = N(S.sumAll.carriers_debt_uzs);
  const [qf, qt] = periodRange('quarter');
  const taxReserve = N((S.periodSum && S.calcPeriod === 'quarter' ? S.periodSum : S.sumAll).tax_estimate_uzs);
  const fixed = (S.settings.fixed_costs || []).reduce((a, fc) => a + (fc.currency === 'USD' ? Math.round(N(fc.amount) * rate) : N(fc.amount)), 0);
  let help = 0;
  for (const p of Object.values((S.partners || {}).partners || {})) for (const [cur, v] of Object.entries(p.help_owed || {})) help += cur === 'USD' ? Math.round(N(v) * rate) : N(v);
  const oform = Math.max(0, Math.round(N(S.sumAll.oformlenie_debt_usd) * rate));
  return { wallets, carriers, taxReserve, fixed, help, oform, safe: wallets - carriers - taxReserve - fixed - help - oform };
}

function tripDue(t) {
  const r = reqById(t.request_id) || {};
  const timing = t.pay_timing || (carrierById(t.carrier_id) || {}).pay_timing || 'after_loading';
  const days = t.pay_days ?? (carrierById(t.carrier_id) || {}).pay_days ?? 0;
  let base = null;
  if (timing === 'advance') base = r.loading_date;
  else if (timing === 'after_loading') base = ['loaded', 'delivered'].includes(t.status) ? (t.loaded_on || r.loading_date) : null;
  else base = t.status === 'delivered' ? t.delivered_on : null;
  return base ? addWorkdays(base, days) : null;
}

}
const liveLots = (reqId) => tripsOf(reqId).filter((t) => t.tractor_id && !['failed', 'cancelled'].includes(t.status));
function factoryCtx(r, forceStamp) {
  const rt = routeById(r.route_id) || {};
  return { ...docBase(r.loading_date, forceStamp), number: r.number, date: r.loading_date, kind: r.kind, route: rt,
    trucks: liveLots(r.id).map((t) => ({ tractor: (vehById(t.tractor_id) || {}).plate_norm, trailer: (vehById(t.trailer_id) || {}).plate_norm })),
    price_uzs_minor: r.price_uzs_minor, price_minor: r.price_minor, price_cur: r.price_cur, fx_rate: r.fx_rate, payment_days: r.payment_days };
}
function carrierCtx(t, forceStamp) {
  const r = reqById(t.request_id), rt = routeById(r.route_id) || {};
  const c = carrierById(t.carrier_id) || {};
  const mm = S.settings.mm || {};
  // своя машина (в т. ч. машина партнёра): исполнитель — сама MM (ТЗ 3.2)
  const carrier = c.is_own ? { name: mm.name, contract_no: null, contract_date: null, director_name: (directorOn('mm', 'director', r.loading_date) || {}).full_name } : c;
  return { ...docBase(r.loading_date, forceStamp), number: t.number, date: r.loading_date, kind: r.kind, route: rt,
    truck: { tractor: (vehById(t.tractor_id) || {}).plate_norm, trailer: (vehById(t.trailer_id) || {}).plate_norm },
    price_uzs_minor: t.price_uzs_minor, pay_days: t.pay_days, pay_method: t.pay_method, carrier };
}
function carrierProblems(t) {
  const p = [];
  if (!t.number) p.push('нет номера (поставьте машину в лот)');
  if (!t.carrier_id) p.push('нет перевозчика');
  if (t.price_minor == null) p.push('нет цены');
  return p;
}
function pdfFactory(reqId, forceStamp) {
  const r = reqById(reqId);
  if (r.price_minor == null) return toast('Впишите цену завода — без неё заявку не сформировать', true);
  if (!liveLots(reqId).length) return toast('Нет машин в лотах', true);
  const rt = routeById(r.route_id) || {};
  makePdf(AKDocs.factoryRequest(factoryCtx(r, forceStamp)), `Заявка_${fileSafe(r.number)}_${fileSafe(rt.name)}_${fmtDate(r.loading_date)}.pdf`);
}
function pdfCarrier(tripId, forceStamp) {
  const t = tripById(tripId);
  const p = carrierProblems(t);
  if (p.length) return toast('Заявку перевозчику не сформировать: ' + p.join(', '), true);
  const c = carrierById(t.carrier_id) || {};
  makePdf(AKDocs.carrierRequest(carrierCtx(t, forceStamp)), `Заявка_перевозчику_${fileSafe(t.number)}_${fileSafe(c.name)}.pdf`);
}
function pdfCarriers(reqId) {
  const r = reqById(reqId);
  const lots = liveLots(reqId);
  const bad = lots.filter((t) => carrierProblems(t).length);
  const ok = lots.filter((t) => !carrierProblems(t).length);
  if (!ok.length) return toast('Нет лотов, готовых к заявке перевозчику (нужны машина, перевозчик и цена)', true);
  if (bad.length && !confirm(`Не готовы ${bad.length} лот(а): ${bad.map((t) => plates(t) || 'пустой').join(', ')} — они будут пропущены. Сформировать по остальным ${ok.length}?`)) return;
  const rt = routeById(r.route_id) || {};
  makePdf(AKDocs.merge(ok.map((t) => AKDocs.carrierRequest(carrierCtx(t)))), `Заявки_перевозчикам_${fileSafe(r.number)}_${fileSafe(rt.name)}_${fmtDate(r.loading_date)}.pdf`);
}

// ================= РЕКВИЗИТЫ И ТЕКСТЫ =================
const SETTING_SECTIONS = [
  { key: 'factory', title: 'Завод (Заказчик в заявке завода)', fields: [
    ['name', 'Название'], ['contract_no', 'Номер договора с заводом'], ['contract_date', 'Дата договора', 'date'],
    ['requisites', 'Реквизиты (каждая строка отдельно)', 'lines'], ['payment_terms', 'Форма и сроки оплаты (текст в заявке)'],
    ['payment_days', 'Срок оплаты заводом, рабочих дней', 'number']] },
  { key: 'mm', title: 'MM (наши реквизиты)', fields: [['name', 'Название'], ['requisites', 'Реквизиты (каждая строка отдельно)', 'lines']] },
  { key: 'request_defaults', title: 'Постоянные тексты заявок', fields: [
    ['shipper', 'Грузоотправитель'], ['loading_contact', 'Адрес погрузки, контакт (заявка завода)'],
    ['carrier_loading_address', 'Адрес погрузки (заявка перевозчику)'], ['export_customs', 'Таможенное оформление экспорта'],
    ['vehicle_spec', 'Спецификация Т/С'], ['cargo', 'Наименование груза'],
    ['special_conditions', 'Особые условия (каждый пункт с новой строки)', 'lines']] },
];
RENDER.settings = () => {
  const ed = canEdit();
  const secs = SETTING_SECTIONS.map((sec) => {
    const v = S.settings[sec.key] || {};
    const rows = sec.fields.map(([k, label, type]) => {
      const cur = v[k];
      const id = `set_${sec.key}_${k}`;
      if (!ed) return `<div class="fr full" style="margin-bottom:8px;"><label>${esc(label)}</label><div>${type === 'lines' ? (cur || []).map(esc).join('<br>') : type === 'date' ? fmtDate(cur) : esc(cur)}</div></div>`;
      if (type === 'lines') return `<div class="fr full"><label>${esc(label)}</label><textarea id="${id}" style="min-height:${Math.max(70, (cur || []).length * 22)}px;">${esc((cur || []).join('\n'))}</textarea></div>`;
      return `<div class="fr${k === 'payment_terms' || k === 'name' ? ' full' : ''}"><label>${esc(label)}</label><input id="${id}" type="${type || 'text'}" value="${esc(cur)}"></div>`;
    }).join('');
    return `<div class="card"><h2>${esc(sec.title)}</h2><div class="grid2">${rows}</div>
      ${ed ? `<div style="margin-top:10px;text-align:right;"><button class="btn primary small" onclick="saveSettingSection('${sec.key}')">Сохранить раздел</button></div>` : ''}</div>`;
  }).join('');
  const members = `<div class="card"><h2>Доступ к блоку</h2><table><thead><tr><th>Кто</th><th>Права</th><th></th></tr></thead><tbody>
    ${S.members.map((m) => `<tr><td>${esc(m.display_name)}</td><td>${m.role === 'owner' ? 'владелец — всё' : 'партнёр — только просмотр'}</td><td>${m.active ? '' : '<span class="tag">отключён</span>'}</td></tr>`).join('')}
    </tbody></table><div class="hint" style="margin-top:8px;">Добавить или отключить участника — через администратора системы.</div></div>`;
  return `<h1>Реквизиты и тексты${roBadge()}</h1>
  <div class="lead">Постоянные части заявок: реквизиты сторон, директора для подписей, особые условия, грузоотправитель. Изменения действуют для новых заявок; уже выпущенные не меняются.</div>
  ${secs}${directorsCard()}${members}`;
};
async function saveSettingSection(key) {
  const sec = SETTING_SECTIONS.find((s) => s.key === key);
  const value = { ...(S.settings[key] || {}) };
  for (const [k, , type] of sec.fields) {
    const raw = document.getElementById(`set_${key}_${k}`).value;
    if (type === 'lines') value[k] = raw.split('\n').map((s) => s.trim()).filter(Boolean);
    else if (type === 'number') value[k] = raw === '' ? null : parseInt(raw, 10);
    else value[k] = raw.trim() || null;
  }
  try { await saveSetting(key, value); await reload(); toast('Сохранено'); }
  catch (e) { toast(humanError(e), true); }
}

// ================= ЖУРНАЛ =================
const TABLE_LBL = {
  ak_carriers: 'Перевозчик', ak_vehicles: 'Машина', ak_vehicle_owners: 'Владелец машины', ak_routes: 'Маршрут',
  ak_directors: 'Директор', ak_wallets: 'Кошелёк', ak_opening_balances: 'Стартовый остаток', ak_settings: 'Настройки', ak_members: 'Доступ',
  ak_requests: 'Заявка завода', ak_request_versions: 'Версия заявки', ak_trips: 'Рейс', ak_movements: 'Движение денег',
  ak_movement_losses: 'Потери по движению', ak_expenses: 'Расход', ak_expense_requests: 'Расход ↔ заявка', ak_fx_rates: 'Курс ЦБ', ak_counters: 'Нумерация', ak_factory_adjustments: 'Корректировка по сверке', ak_trip_deductions: 'Удержание',
};
const FIELD_HIDE = new Set(['id', 'created_at', 'created_by', 'updated_at', 'updated_by', 'plate_norm']);
async function loadAudit() {
  let q = sb.from('ak_audit_log').select('*').order('at', { ascending: false }).limit(300);
  if (S.auditTable) q = q.eq('table_name', S.auditTable);
  const { data, error } = await q;
  if (error) { toast(humanError(error), true); return; }
  S.audit = data; if (S.page === 'audit') render();
}
function auditTitle(a) {
  const d = a.new_data || a.old_data || {};
  if (a.table_name === 'ak_carriers' || a.table_name === 'ak_routes') return d.name;
  if (a.table_name === 'ak_vehicles') return d.plate_norm || d.plate;
  if (a.table_name === 'ak_vehicle_owners') { const v = S.vehicles.find((x) => x.id === d.vehicle_id); const c = carrierById(d.carrier_id); return `${v ? v.plate_norm : ''} → ${c ? c.name : ''} с ${fmtDate(d.valid_from)}`; }
  if (a.table_name === 'ak_directors') return d.full_name;
  if (a.table_name === 'ak_settings') return d.key;
  if (a.table_name === 'ak_requests') return reqTitle(d);
  if (a.table_name === 'ak_trips') return `${reqLabel(reqById(d.request_id))} · ${plates(d)} · ${(carrierById(d.carrier_id) || {}).name || 'без перевозчика'}`;
  if (a.table_name === 'ak_movements') return `${MV_KIND[d.kind] || ''}: ${fmtMoney(d.amount_in_minor, d.cur_in)}`;
  if (a.table_name === 'ak_expenses') return `${EXP_CAT[d.category] || ''}: ${fmtMoney(d.amount_minor, d.currency)}`;
  if (a.table_name === 'ak_fx_rates') return `${fmtDate(d.rate_date)}: ${fmtRate(d.usd_uzs)}`;
  if (a.table_name === 'ak_opening_balances') return `${(OPENING_KINDS.find((k) => k.kind === d.kind) || {}).title || ''}: ${fmtMoney(d.amount_minor, d.currency)}`;
  return a.row_id;
}
const showVal = (v) => v === null || v === undefined || v === '' ? '∅' : typeof v === 'object' ? JSON.stringify(v) : String(v);
function auditDiff(a) {
  if (a.action !== 'update') return '';
  const o = a.old_data || {}, n = a.new_data || {};
  return Object.keys(n).filter((k) => !FIELD_HIDE.has(k) && JSON.stringify(o[k]) !== JSON.stringify(n[k]))
    .map((k) => `<div><b>${esc(k)}</b>: <span class="old">${esc(showVal(o[k]))}</span> → <span class="new">${esc(showVal(n[k]))}</span></div>`).join('');
}
RENDER.audit = () => {
  const ACT = { insert: '<span class="tag green">создано</span>', update: '<span class="tag blue">изменено</span>', delete: '<span class="tag red">удалено</span>' };
  const dec = (r) => { try { return decodeURIComponent(r); } catch { return r; } };
  const body = S.audit.map((a) => `<tr><td style="white-space:nowrap;">${fmtDateTime(a.at)}</td><td>${esc(memberName(a.user_id))}</td>
    <td>${esc(TABLE_LBL[a.table_name] || a.table_name)}<div class="muted">${esc(auditTitle(a))}</div></td><td>${ACT[a.action]}</td>
    <td class="diff">${auditDiff(a)}${a.reason ? `<div style="margin-top:3px;"><b>Причина:</b> ${esc(dec(a.reason))}</div>` : ''}</td></tr>`).join('');
  return `<h1>Журнал изменений</h1>
  <div class="lead">Каждое изменение записывается автоматически: кто, когда, что было и что стало, причина. Журнал нельзя править или удалить — ни с сайта, ни через бота.</div>
  <div class="toolbar"><select style="max-width:260px;" onchange="S.auditTable=this.value;loadAudit()">
    <option value="">Все разделы</option>${Object.entries(TABLE_LBL).map(([k, v]) => `<option value="${k}"${S.auditTable === k ? ' selected' : ''}>${esc(v)}</option>`).join('')}
  </select><span class="muted" style="font-size:12px;">последние 300 записей</span></div>
  <div class="tbl-wrap"><table><thead><tr><th>Когда</th><th>Кто</th><th>Что</th><th>Действие</th><th>Изменения</th></tr></thead>
  <tbody>${body || '<tr><td colspan="5" class="empty">Записей пока нет</td></tr>'}</tbody></table></div>`;
};

// ================= старт =================
(async () => {
  const { data: { session } } = await sb.auth.getSession();
  if (session) enter(session);
})();
